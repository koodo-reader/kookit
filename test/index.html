<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <script src="../dist/koodo-parser.umd.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/localforage/1.9.0/localforage.js"></script>
    <title>Kookit - Koodo Reader</title>
  </head>
  <body>
    <input type="file" id="yourFile" />
    <div class="ebook-viewer"></div>
    <script>
      var fileToRead = document.getElementById("yourFile");
      fileToRead.addEventListener(
        "change",
        function (event) {
          var files = fileToRead.files;
          if (files.length) {
            let reader = new FileReader();
            reader.readAsArrayBuffer(files[0]);
            reader.onload = (event) => {
              const file_content = event.target.result;
              localforage.setItem("book", file_content);
            };
          }
        },
        false
      );
      localforage.getItem("book").then((result) => {
        const { TxtRender } = Kookit;
        console.log(document.querySelector("#ebook-viewer"));
        let rendition = new TxtRender(result);
        rendition.renderTo(document.getElementsByClassName("ebook-viewer")[0]);
        // console.log(TxtRender, Kookit);
        // console.log(rendition.getChapter());
      });
    </script>
  </body>
</html>

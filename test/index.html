<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <script src="../dist/kookit.umd.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/localforage/1.9.0/localforage.js"></script>
    <script src="./unrar.js"></script>
    <script src="./jszip.min.js"></script>
    <script src="./epub.min.js"></script>
    <script src="./fflate.min.js"></script>

    <title>Kookit - Koodo Reader</title>
  </head>
  <body>
    <input type="file" id="yourFile" />
    <div class="ebook-viewer" id="page-area"></div>
    <div class="next">Next</div>
    <div class="prev">Prev</div>
    <ul class="content"></ul>
    <script>
      const handleNext = () => {
        rendition.next();
      };
      const handlePrev = () => {
        rendition.prev();
      };
      var fileToRead = document.getElementById("yourFile");
      fileToRead.addEventListener(
        "change",
        function (event) {
          var files = fileToRead.files;
          if (files.length) {
            let reader = new FileReader();
            reader.readAsArrayBuffer(files[0]);
            reader.onload = (event) => {
              const file_content = event.target.result;
              localforage.setItem("book", file_content);
            };
          }
        },
        false
      );

      const renderFunc = async () => {
        localforage.getItem("book").then(async (result) => {
          const { MobiRender } = Kookit;
          // let unrar = new Unrar(result);
          // var entries = unrar.getEntries();

          // let rendition = new ComicRender(
          //   entries.map((item) => item.name),
          //   unrar,
          //   "scroll",
          //   "cbr"
          // );

          // console.log(
          //   unrar.decompress(
          //     "Fantastic Four Anniversary Tribute (2021) 001-001.jpg"
          //   )
          // );
          // await rendition.renderTo(
          //   document.getElementsByClassName("ebook-viewer")[0]
          // );

          let rendition = new MobiRender(result, "double");
          await rendition.renderTo(
            document.getElementsByClassName("ebook-viewer")[0]
          );
          let chapterList = await rendition.getChapter();

          document
            .getElementsByClassName("next")[0]
            .addEventListener("click", () => {
              rendition.next();
            });
          document
            .getElementsByClassName("prev")[0]
            .addEventListener("click", () => {
              rendition.prev();
            });
          rendition.on("rendered", () => {
            console.log("rendered from html");
          });
          chapterList.forEach((item) => {
            let li = document.createElement("li");
            li.innerText =
              item.title.indexOf("#") > 0
                ? item.title.split("#")[0]
                : item.title;
            li.addEventListener("click", (e) => {
              e.preventDefault();
              rendition.goToChapter(item.index);
            });
            document.getElementsByClassName("content")[0].appendChild(li);
          });
        });
      };
      renderFunc();
      window.addEventListener("resize", renderFunc);
    </script>
  </body>
</html>

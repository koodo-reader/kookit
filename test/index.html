<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <script type="module">
      import "./pdfjs/pdf.min.mjs";
      // import * as pdfjsWorker from "./pdfjs/pdf.worker.mjs";
      pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdfjs/pdf.worker.min.mjs";
      import * as Kookit from "../dist/kookit.mjs";
      window.Kookit = Kookit;
    </script>
    <!-- <script src="../dist/kookit.umd.js"></script> -->
    <script src="https://cdn.bootcdn.net/ajax/libs/localforage/1.9.0/localforage.js"></script>
    <!-- <script src="./jszip.min.js"></script> -->
    <script src="./fflate.min.js"></script>
    <script src="./underscore-umd-min.js"></script>
    <script src="./untar.js"></script>
    <script src="./zip-no-worker.min.js"></script>
    <script src="../lib/libunrar/rpc.js"></script>
    <script src="../lib/7z-wasm/7zz.umd.js"></script>
    <title>Kookit - Koodo Reader</title>
  </head>
  <body>
    <input type="file" id="yourFile" />
    <div class="ebook-viewer" id="page-area"></div>
    <div class="next">Next</div>
    <div class="prev">Prev</div>
    <ul class="content"></ul>
    <script>
      const handleNext = () => {
        rendition.next();
      };
      const handlePrev = () => {
        rendition.prev();
      };
      var fileToRead = document.getElementById("yourFile");
      fileToRead.addEventListener(
        "change",
        function (event) {
          var files = fileToRead.files;
          if (files.length) {
            let reader = new FileReader();
            reader.readAsArrayBuffer(files[0]);
            reader.onload = (event) => {
              localforage.setItem("book", {
                content: event.target.result,
                name: files[0].name,
              });
            };
          }
        },
        false
      );

      const renderFunc = async () => {
        localforage.getItem("book").then(async (result) => {
          var loaded = function () {};

          var progressShow = function (fileName, fileSize, progress) {};

          var errShow = function (errMsg) {};

          const format = (result.name.split(".").pop() || "").toUpperCase();
          let rendition = Kookit.BookHelper.getRendition(
            result.content,
            {
              format: format,
              readerMode: "scroll",
              animation: "sliding",
              isDarkMode: "no",
              isMobile: "no",
            },
            Kookit
          );
          if (!rendition) return;
          await rendition.renderTo(
            document.getElementsByClassName("ebook-viewer")[0]
          );

          let chapterList = await rendition.getChapter();

          document
            .getElementsByClassName("next")[0]
            .addEventListener("click", () => {
              rendition.next();
            });
          document
            .getElementsByClassName("prev")[0]
            .addEventListener("click", () => {
              rendition.prev();
            });
          rendition.on("rendered", () => {});
          chapterList.forEach((item) => {
            let li = document.createElement("li");
            li.innerText = item.label;
            li.addEventListener("click", (e) => {
              e.preventDefault();
              rendition.goToChapter(item.index);
            });
            document.getElementsByClassName("content")[0].appendChild(li);
          });
        });
      };
      renderFunc();
      window.addEventListener("resize", renderFunc);
    </script>
  </body>
</html>
